<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b3b" />
      <stop offset="50%" stop-color="#0a3d52" />
      <stop offset="100%" stop-color="#041b26" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14607d" />
      <stop offset="50%" stop-color="#1a7496" />
      <stop offset="100%" stop-color="#104e66" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="600" height="700" fill="url(#oceanBg)" />

  <!-- Subtle Latitude / Longitude Graticule for Latin America -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="3,3">
    <!-- Latitudes -->
    <line x1="20" y1="90" x2="580" y2="90" />
    <line x1="20" y1="180" x2="580" y2="180" />
    <line x1="20" y1="270" x2="580" y2="270" />
    <line x1="20" y1="360" x2="580" y2="360" />
    <line x1="20" y1="450" x2="580" y2="450" />
    <line x1="20" y1="540" x2="580" y2="540" />
    <line x1="20" y1="630" x2="580" y2="630" />
    <!-- Longitudes -->
    <line x1="100" y1="30" x2="100" y2="670" />
    <line x1="200" y1="30" x2="200" y2="670" />
    <line x1="300" y1="30" x2="300" y2="670" />
    <line x1="400" y1="30" x2="400" y2="670" />
    <line x1="500" y1="30" x2="500" y2="670" />
  </g>

  <!-- Geographic Landmass: Latin America & Caribbean Only -->
  <g fill="url(#landGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.55" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))">
    <!-- Mexico & Central America -->
    <path d="M 65 65 
             Q 95 60 140 70 
             Q 185 85 205 105 
             L 215 125 
             Q 195 135 180 145 
             L 150 140 
             Q 125 155 110 135 
             L 80 115 
             Z" />
             
    <path d="M 180 145 
             Q 205 145 220 160 
             Q 235 175 245 190 
             L 260 205 
             Q 250 215 235 210 
             Q 220 200 205 180 
             L 180 165 
             Z" />

    <!-- Caribbean Islands -->
    <!-- Cuba -->
    <path d="M 220 100 Q 255 105 285 115 Q 260 120 225 110 Z" />
    <!-- Hispaniola -->
    <path d="M 295 120 Q 325 125 340 122 Q 330 132 300 128 Z" />
    <!-- Puerto Rico -->
    <ellipse cx="360" cy="128" rx="14" ry="6" />
    <!-- Lesser Antilles Arc -->
    <circle cx="385" cy="145" r="3.5" />
    <circle cx="390" cy="160" r="3.5" />
    <circle cx="388" cy="175" r="3.5" />
    <circle cx="380" cy="190" r="4" />

    <!-- South America Main Continental Mass -->
    <path d="M 260 205 
             Q 280 190 320 190 
             Q 360 185 410 205 
             Q 455 225 480 250 
             Q 505 285 490 320 
             Q 470 360 450 400 
             Q 430 435 410 470 
             Q 380 520 355 570 
             Q 340 610 325 650 
             Q 310 660 305 640 
             Q 295 590 285 540 
             Q 275 480 265 420 
             Q 250 370 235 320 
             Q 220 270 240 230 
             Z" />
             
    <!-- Tierra del Fuego archipelago -->
    <path d="M 305 655 Q 325 660 320 675 Q 300 670 305 655 Z" />
    <!-- Falklands / Malvinas -->
    <circle cx="365" cy="635" r="5" />
    <circle cx="380" cy="630" r="4" />
  </g>

  <!-- Regional Internal Accent Boundaries (Andes Ridge, Amazon Basin, Southern Cone) -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" stroke-opacity="0.35" fill="none">
    <!-- Andes Mountain Spine -->
    <path d="M 265 215 Q 245 280 260 360 Q 285 460 305 570 L 315 640" stroke-width="1.2" stroke="#67e8f9" stroke-opacity="0.5" />
    <!-- Amazon basin boundary -->
    <path d="M 300 230 Q 360 260 430 270 Q 420 330 360 350 Z" />
    <!-- Southern Cone / Mercosur divider -->
    <path d="M 270 450 Q 340 440 405 460" />
  </g>

  <!-- Network Interconnection Nodes / IDB Projects Across Latin America -->
  <g filter="url(#glow)">
    <!-- Connection lines -->
    <line x1="160" y1="110" x2="260" y2="205" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="260" y1="205" x2="310" y2="240" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="310" y1="240" x2="440" y2="280" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="310" y1="240" x2="270" y2="330" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="270" y1="330" x2="430" y2="390" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="270" y1="330" x2="330" y2="480" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="330" y1="480" x2="385" y2="475" stroke="url(#glowLine)" stroke-width="1.5" />
    <line x1="330" y1="480" x2="315" y2="590" stroke="url(#glowLine)" stroke-width="1.5" />

    <!-- Project Nodes (Mexico City, Bogotá, Lima, Brasília, São Paulo, Santiago, Buenos Aires) -->
    <!-- Mexico City -->
    <circle cx="160" cy="110" r="5" fill="#38bdf8" />
    <circle cx="160" cy="110" r="9" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Panama / Central America -->
    <circle cx="260" cy="205" r="4.5" fill="#38bdf8" />

    <!-- Bogotá / Northern Andes -->
    <circle cx="310" cy="240" r="5.5" fill="#38bdf8" />
    <circle cx="310" cy="240" r="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Lima / Pacific -->
    <circle cx="270" cy="330" r="5" fill="#38bdf8" />

    <!-- Brasília / Brazil East -->
    <circle cx="440" cy="280" r="6" fill="#38bdf8" />
    <circle cx="440" cy="280" r="11" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- São Paulo / Rio Hub -->
    <circle cx="430" cy="390" r="5.5" fill="#38bdf8" />

    <!-- Santiago -->
    <circle cx="310" cy="490" r="4.5" fill="#38bdf8" />

    <!-- Buenos Aires / Southern Cone -->
    <circle cx="385" cy="475" r="5.5" fill="#38bdf8" />
    <circle cx="385" cy="475" r="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- Patagonia Hub -->
    <circle cx="315" cy="590" r="4" fill="#38bdf8" />
  </g>

  <!-- Regional Label Badge -->
  <g transform="translate(40, 640)">
    <rect width="180" height="32" rx="6" fill="#041a24" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="90" y="20" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">LATIN AMERICA &amp; CARIBBEAN</text>
  </g>
</svg>
